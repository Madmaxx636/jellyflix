name: Android

# Compiles and tests the Android app (phones, tablets and Google TV) and keeps the debug APK as a download.
on:
  push:
    branches: [android]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle test assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jellyflix-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

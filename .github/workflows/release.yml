name: Release

# Builds the app on each system. Pushing a tag like v0.1.2 also publishes a GitHub release with every file and its checksum.
# Run it by hand (Actions > Release > Run workflow) to try the builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux --x64 --arm64
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tools for the rpm and pacman packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - name: Type check, lint and unit tests
        if: runner.os == 'Linux'
        run: npm run check
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          # the update files (latest*.yml, *.blockmap) are for the app, not for people
          (cd files && sha256sum $(ls | grep -vE '\.(yml|blockmap)$') > SHA256SUMS.txt)
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'Pick the file for your system: `.exe` (installer) or the portable `.exe` for Windows; `.dmg` or `.zip` for macOS (Intel `x64`, Apple silicon `arm64`); `.AppImage`, `.deb`, `.rpm`, `.pacman` or `.tar.gz` for Linux (`x64` or `arm64`).'
            echo
            echo 'The Windows and macOS builds are not signed, so Windows SmartScreen and macOS Gatekeeper will warn before the first start (Windows: More info > Run anyway; macOS: right-click the app > Open).'
            echo
            awk -v v="$version" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md
            echo
            echo '### SHA-256'
            echo '```'
            cat files/SHA256SUMS.txt
            echo '```'
          } > body.md
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" files/* --title "Jellyflix ${GITHUB_REF_NAME#v}" --notes-file body.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Scripts only from the app itself. Pictures, video and API calls go to whichever server the user signs in to, so
         those can't be pinned to one address; plugins, frames, <base> and form posts are not needed at all. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob:; connect-src *; worker-src blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Jellyflix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
